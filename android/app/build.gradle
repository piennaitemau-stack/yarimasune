plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.kidsgakushu.app'
    compileSdk 35

    defaultConfig {
        applicationId "jp.kidsgakushu.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "kids-gakushu-${variant.name}.apk"
        }
    }
}

def htmlSrc = rootProject.file('../kids-gakushu.html')

tasks.register('copyWebAssets', Copy) {
    from htmlSrc
    into layout.projectDirectory.dir('src/main/assets')
    rename { 'index.html' }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

preBuild.dependsOn copyWebAssets
